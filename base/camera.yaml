# -----------------------------------------------------------------------------
# Home Assistant GUI Button Entities
# -----------------------------------------------------------------------------
button:
  - platform: template
    name: "Camera Reset Settings"
    id: reset_camera_settings
    icon: "mdi:camera-retake-outline"
    entity_category: config
    on_press:
      - lambda: id(defer_camera_update) = true;
      - select.set_index:
          id: camera_resolution_select
          index: 4
      - select.set_index:
          id: camera_jpeg_quality_select
          index: 0
      - select.set_index:
          id: camera_agc_gain_select
          index: 0
      - select.set_index:
          id: camera_wb_mode_select
          index: 0
      - select.set_index:
          id: camera_special_effect_select
          index: 0
      - switch.turn_on: camera_rotation_switch
      - switch.turn_on: camera_aec_switch
      - switch.turn_off: camera_aec2_switch
      - switch.turn_on: camera_agc_switch
      - switch.turn_off: camera_test_pattern_switch
      - number.set:
          id: camera_ae_level_number
          value: 0
      - number.set:
          id: camera_aec_value_number
          value: 300
      - number.set:
          id: camera_agc_value_number
          value: 0
      - number.set:
          id: camera_brightness_number
          value: 0
      - number.set:
          id: camera_contrast_number
          value: 0
      - number.set:
          id: camera_saturation_number
          value: 0
      - lambda: |-
          if (esp_camera_sensor_get() != nullptr) {
            id(camera_dev).update_camera_parameters();
          }
          id(defer_camera_update) = false;
